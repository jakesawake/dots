set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"

set -g prefix C-a
unbind C-b
bind-key C-a send-prefix

unbind %
bind | split-window -h 

unbind '"'
bind - split-window -v

unbind r
bind r source-file ~/.tmux.conf

bind j resize-pane -D 5
bind k resize-pane -U 5
bind l resize-pane -R 5
bind h resize-pane -L 5

bind -r m resize-pane -Z

# Claude Code popup: one persistent background session per directory (hashed path).
# prefix + y toggles it: inside a claude-* session it detaches (closing the popup,
# Claude keeps running); anywhere else it creates/attaches the session in a popup.
# NOTE: claude is called by full path because tmux's PATH doesn't include ~/.local/bin.
# On a new machine, check `which claude` and update the path below if it differs.
bind y if-shell -F '#{m:claude-*,#{session_name}}' {
  detach-client
} {
  run-shell '\
    SESSION="claude-$(echo #{pane_current_path} | md5sum | cut -c1-8)"; \
    tmux has-session -t "$SESSION" 2>/dev/null || \
    tmux new-session -d -s "$SESSION" -c "#{pane_current_path}" "$HOME/.local/bin/claude"; \
    tmux set-option -t "$SESSION" status off; \
    tmux display-popup -w80% -h80% -E "tmux attach-session -t $SESSION"'
}

unbind [
unbind Escape
bind v copy-mode

set -g mouse on

set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on

set-window-option -g mode-keys vi

bind-key -T copy-mode-vi 'v' send -X begin-selection # start selecting text with "v"
bind-key -T copy-mode-vi 'y' send -X copy-selection # copy text with "y"

unbind -T copy-mode-vi MouseDragEnd1Pane # don't exit copy mode when dragging with mouse

# remove delay for exiting insert mode with ESC in Neovim
set -sg escape-time 10

# allow Kitty graphics protocol to pass through tmux to the terminal (required by image.nvim)
set -g allow-passthrough on
set -ga update-environment TERM_PROGRAM

# send focus-in/focus-out events to Neovim when switching tmux windows or panes;
# without this, image.nvim's tmux_show_only_in_active_window can't hide images on window switch
set -g focus-events on

# tpm plugin
set -g @plugin 'tmux-plugins/tpm'

# list of tmux plugins
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-resurrect' # persist tmux sessions after computer restart
set -g @plugin 'tmux-plugins/tmux-continuum' # automatically saves sessions for you every 15 minutes
set -g @plugin 'fabioluciano/tmux-tokyo-night'
set -g @plugin 'omerxx/tmux-sessionx' # fuzzy session/window/pane switcher UI


# restore pane contents
set -g @resurrect-capture-pane-contents 'on'

# automatically restores your last saved tmux environment whenever the tmux server starts
set -g @continuum-restore 'on'

# Restore Neovim sessions
set -g @resurrect-strategy-nvim 'session'

# sessionx: open with prefix + O (default); shows sessions, windows, and panes
set -g @sessionx-bind 'o'

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
